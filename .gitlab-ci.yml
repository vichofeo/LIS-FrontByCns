include:
  - project: "sistemas-nacional/templates"
    file: "/gitlab/workflow-rules.yml"
  - project: "sistemas-nacional/templates"
    file: "/gitlab/kaniko-build.yml"

kaniko-build:
  variables:
    KANIKO_CACHE_ARGS: "--single-snapshot --compressed-caching=false --snapshot-mode=redo --use-new-run"
    KANIKO_ARGS: "$KANIKO_CACHE_ARGS --registry-mirror $REGISTRY_MIRROR"
  stage: build

.downstream-deployment:
  stage: deploy
  needs:
    - job: kaniko-build
      artifacts: true
  variables:
    UPSTREAM_CI_ENVIRONMENT_NAME: $CI_ENVIRONMENT_NAME
    UPSTREAM_CI_PROJECT_NAME: $CI_PROJECT_NAME
    API_BASE_URL: $API_BASE_URL
    AUTH_BASE_URL: $AUTH_BASE_URL
    AUTH_CLIENT_ID: $AUTH_CLIENT_ID
    AUTH_SCOPE: $AUTH_SCOPE
    IMAGE_TAG: $BUILD_IMAGE_TAG
  trigger:
    project: "devops/pipeline-library"

deploy_development:
  extends: .downstream-deployment
  environment: development
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

deploy_staging:
  extends: .downstream-deployment
  environment: staging
  rules:
    - if: $CI_COMMIT_REF_NAME =~ /^release/ && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH

deploy_production:
  extends: .downstream-deployment
  environment: production
  when: manual
  rules:
    - if: "$CI_COMMIT_TAG"
